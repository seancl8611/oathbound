name: Godot 4.7.2 Project Check

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

jobs:
  project-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        run: godot --version

      - name: Import project headlessly
        run: godot --headless --path game/oathbound --import

      - name: Compile and load editor project
        run: godot --headless --editor --path game/oathbound --quit-after 3

      - name: Smoke current RunScene and assert Player ownership
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound --quit-after 30 res://Utility/RunScene.tscn 2>&1 | tee runscene-smoke.log
          grep -F "[OathboundCombatPlayer]" runscene-smoke.log
          grep -F "player_factory_assigned script=res://Player/OathboundCombatPlayer.gd" runscene-smoke.log
          if grep -F "Wrong active Player script" runscene-smoke.log; then
            echo "Canonical Player ownership assertion failed."
            exit 1
          fi
