name: Godot 4.7.2 Project Check

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

jobs:
  project-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Godot version
        run: godot --version

      - name: Import project headlessly
        run: godot --headless --path game/oathbound --import

      - name: Compile and load editor project
        run: godot --headless --editor --path game/oathbound --quit-after 3

      - name: Smoke current RunScene and assert runtime ownership
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound --quit-after 30 res://Utility/RunScene.tscn 2>&1 | tee runscene-smoke.log

          assert_log() {
            local label="$1"
            local needle="$2"
            if grep -F "$needle" runscene-smoke.log >/dev/null; then
              echo "PASS: $label"
            else
              echo "FAIL: $label -- missing: $needle"
              exit 1
            fi
          }

          assert_log "canonical Player created" "player_factory_created script=res://Player/OathboundCombatPlayer.gd"
          assert_log "canonical Player assigned" "player_factory_assigned script=res://Player/OathboundCombatPlayer.gd"
          assert_log "current ProstheticManager" "prosthetic_manager script=res://Core/Prosthetics/OathboundProstheticManager.gd"
          assert_log "current AttackDirector" "attack_director script=res://Core/Prosthetics/OathboundAttackDirector.gd"
          assert_log "current Prosthetic executor" "prosthetic_executor script=res://Core/Prosthetics/OathboundProstheticExecutor.gd"
          assert_log "current RunHUD" "run_hud script=res://Core/Prosthetics/OathboundRunHUD.gd"
          assert_log "current RelicRuntime" "relic_runtime script=res://Core/Relics/OathboundRelicRuntime.gd"
          assert_log "current CorruptionRuntime" "corruption_runtime script=res://Core/Corruption/OathboundCorruptionRuntime.gd"
          assert_log "current UpgradeService" "upgrade_service script=res://Core/Relics/OathboundUpgradeService.gd"
          assert_log "current PlaytestLab" "playtest_lab script=res://Core/Corruption/OathboundCorruptionPlaytestLab.gd"
          assert_log "Prosthetics Playtest tab" "[OathboundPlaytestLab] Prosthetics tab built with 8 tools"
          assert_log "Relics Playtest tab" "[OathboundPlaytestLab] Relics tab built with 10 relics"
          assert_log "Corruption Playtest tab" "[OathboundPlaytestLab] Corruption tab built"
          assert_log "Prosthetic registry" "[OathboundProstheticManager] registry validation PASS"
          assert_log "100-Spirit executor" "[OathboundProstheticExecutor] v1.0 - canonical 100 Spirit runtime"
          assert_log "persistent Relic runtime" "[OathboundRelicRuntime] v1.0 - one-slot persistent Relic runtime"
          assert_log "Corruption runtime" "[OathboundCorruptionRuntime] v1.0 - 0/100 run pressure + Shrine authority"

          if grep -E "player_factory_(created|assigned).*OathboundPlayerStability.gd" runscene-smoke.log; then
            echo "FAIL: Legacy Stability Player was instantiated by the current run."
            exit 1
          fi
          if grep -E "Wrong active Player script|Wrong ProstheticManager script|Wrong AttackDir script|Wrong Prosthetic executor script|Wrong RunHUD script|Wrong RelicRuntime script|Wrong CorruptionRuntime script|Wrong UpgradeService script|Wrong PlaytestLab script" runscene-smoke.log; then
            echo "FAIL: Canonical runtime ownership assertion emitted an error."
            exit 1
          fi
          if grep -F "SCRIPT ERROR:" runscene-smoke.log; then
            echo "FAIL: RunScene emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" runscene-smoke.log; then
            echo "FAIL: RunScene emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Upload RunScene smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runscene-smoke-${{ github.run_id }}
          path: runscene-smoke.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Corruption state-machine contract
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Corruption/CorruptionRuntimeSmoke.tscn 2>&1 | tee corruption-smoke.log
          grep -F "[CorruptionRuntimeSmoke] PASS - caps awakening support Resist Embrace Stabilize" corruption-smoke.log
          if grep -F "SCRIPT ERROR:" corruption-smoke.log; then
            echo "FAIL: Corruption contract emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" corruption-smoke.log; then
            echo "FAIL: Corruption contract emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Hushiro seeded route contract
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Regions/Hushiro/Validation/HushiroRouteContractSmoke.tscn 2>&1 | tee hushiro-route-contract.log
          grep -F "[HushiroRouteContractSmoke] PASS" hushiro-route-contract.log
          if grep -F "SCRIPT ERROR:" hushiro-route-contract.log; then
            echo "FAIL: Hushiro route contract emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" hushiro-route-contract.log; then
            echo "FAIL: Hushiro route contract emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Traverse one complete generated Hushiro route
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Regions/Hushiro/Validation/HushiroFullRunSmoke.tscn 2>&1 | tee hushiro-full-run.log
          grep -F "[HushiroFullRunSmoke] PASS" hushiro-full-run.log
          if grep -F "SCRIPT ERROR:" hushiro-full-run.log; then
            echo "FAIL: Full Hushiro traversal emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" hushiro-full-run.log; then
            echo "FAIL: Full Hushiro traversal emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Upload Hushiro validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hushiro-validation-${{ github.run_id }}
          path: |
            hushiro-route-contract.log
            hushiro-full-run.log
          if-no-files-found: warn
          retention-days: 7

      - name: Smoke current Shrine chamber
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound --quit-after 8 res://Core/Chambers/Types/ShrineChamber.tscn 2>&1 | tee shrine-smoke.log
          grep -F "[OathboundShrine] v1.0 - Corruption support / Resist / Embrace / Stabilize" shrine-smoke.log
          if grep -F "SCRIPT ERROR:" shrine-smoke.log; then
            echo "FAIL: Shrine smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" shrine-smoke.log; then
            echo "FAIL: Shrine smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Smoke current Merchant chamber
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound --quit-after 8 res://Core/Chambers/Types/MerchantChamber.tscn 2>&1 | tee merchant-smoke.log
          grep -F "[OathboundMerchant] current offers" merchant-smoke.log
          if grep -F "SCRIPT ERROR:" merchant-smoke.log; then
            echo "FAIL: Merchant smoke emitted a GDScript runtime error."
            exit 1
          fi

      - name: Smoke current Forge Relic menu
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound --quit-after 8 res://Core/Relics/OathboundForgeMenu.tscn 2>&1 | tee forge-smoke.log
          grep -F "[OathboundForgeMenu] v1.0 - Forge Relic collection/mastery management" forge-smoke.log
          if grep -F "SCRIPT ERROR:" forge-smoke.log; then
            echo "FAIL: Forge smoke emitted a GDScript runtime error."
            exit 1
          fi
