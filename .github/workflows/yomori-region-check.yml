name: Yomori Region Check

on:
  push:
    branches:
      - "agent/yomori-region-reconciliation"
  pull_request:
    paths:
      - "game/oathbound/Regions/Yomori/**"
      - "game/oathbound/Enemy/Area 2/**"
      - "game/oathbound/Textures/Enemy/foot_soldier/**"
      - "game/oathbound/Textures/Enemy/shield_captain/**"
      - "game/oathbound/Textures/Enemy/spirit_monk/**"
      - "game/oathbound/Core/Chambers/**"
      - "game/oathbound/Utility/SceneRegistry.gd"
      - "game/oathbound/Utility/RunData.gd"
      - "game/oathbound/Utility/RunScene.gd"
      - "game/oathbound/Utility/duo_boss_manager.gd"
      - "game/oathbound/autoload/OathboundGameFlow.gd"
      - ".github/workflows/yomori-region-check.yml"
  workflow_dispatch:

jobs:
  yomori-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import and compile project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound --import 2>&1 | tee yomori-import.log
          godot --headless --editor --path game/oathbound --quit-after 3 2>&1 | tee yomori-editor.log
          if grep -F "SCRIPT ERROR:" yomori-import.log yomori-editor.log; then
            echo "FAIL: Yomori package introduced a GDScript import/editor error."
            exit 1
          fi

      - name: Verify Yomori post-import visual assets
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Regions/Yomori/Validation/YomoriVisualAssetSmoke.tscn 2>&1 | tee yomori-visual-assets.log
          grep -F "[YomoriVisualAssetSmoke] PASS" yomori-visual-assets.log
          if grep -F "SCRIPT ERROR:" yomori-visual-assets.log; then
            echo "FAIL: Yomori visual asset smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" yomori-visual-assets.log; then
            echo "FAIL: Yomori visual asset smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Yomori seeded route and roster contract
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Regions/Yomori/Validation/YomoriRouteContractSmoke.tscn 2>&1 | tee yomori-route-contract.log
          grep -F "[YomoriRouteContractSmoke] PASS" yomori-route-contract.log
          if grep -F "SCRIPT ERROR:" yomori-route-contract.log; then
            echo "FAIL: Yomori route contract emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" yomori-route-contract.log; then
            echo "FAIL: Yomori route contract emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Twin Maws behavior contract
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Regions/Yomori/Validation/TwinMawsContractSmoke.tscn 2>&1 | tee twin-maws-contract.log
          grep -F "[TwinMawsContractSmoke] PASS" twin-maws-contract.log
          if grep -F "SCRIPT ERROR:" twin-maws-contract.log; then
            echo "FAIL: Twin Maws contract emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" twin-maws-contract.log; then
            echo "FAIL: Twin Maws contract emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify reproduced Yomori playtest blockers
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Regions/Yomori/Validation/YomoriPlaytestRegressionSmoke.tscn 2>&1 | tee yomori-playtest-regression.log
          grep -F "[YomoriPlaytestRegressionSmoke] PASS" yomori-playtest-regression.log
          if grep -F "SCRIPT ERROR:" yomori-playtest-regression.log; then
            echo "FAIL: Yomori playtest regression emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "Lambda capture" yomori-playtest-regression.log; then
            echo "FAIL: Lantern Wraith retained a freed lambda capture."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" yomori-playtest-regression.log; then
            echo "FAIL: Yomori playtest regression emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Traverse one complete generated Yomori route
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Regions/Yomori/Validation/YomoriFullRunSmoke.tscn 2>&1 | tee yomori-full-run.log
          grep -F "[YomoriFullRunSmoke] PASS" yomori-full-run.log
          if grep -F "SCRIPT ERROR:" yomori-full-run.log; then
            echo "FAIL: Full Yomori traversal emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" yomori-full-run.log; then
            echo "FAIL: Full Yomori traversal emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Upload Yomori validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yomori-validation-${{ github.run_id }}
          path: |
            yomori-import.log
            yomori-editor.log
            yomori-visual-assets.log
            yomori-route-contract.log
            twin-maws-contract.log
            yomori-playtest-regression.log
            yomori-full-run.log
          if-no-files-found: warn
          retention-days: 7
