name: Release Shell Check

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "game/oathbound/Core/Release/**"
      - "game/oathbound/Core/Presentation/OathboundAchievementRuntime.gd"
      - "game/oathbound/Core/Progression/OathboundPersistentProstheticManager.gd"
      - "game/oathbound/Core/Progression/OathboundStrandProgressionManager.gd"
      - "game/oathbound/Core/Prosthetics/OathboundRunHUD.gd"
      - "game/oathbound/Core/Relics/OathboundUpgradeService.gd"
      - "game/oathbound/GUI/DiscoveryBoardMenu.gd"
      - "game/oathbound/GUI/OathboundAccessibleDiscoveryBoardMenu.gd"
      - "game/oathbound/GUI/OathboundDialogueOverlay.gd"
      - "game/oathbound/GUI/OathboundAccessibleDialogueOverlay.gd"
      - "game/oathbound/GUI/ForgeMenu.gd"
      - "game/oathbound/GUI/OathboundReleaseForgeMenu.gd"
      - "game/oathbound/GUI/ForgeMenu.tscn"
      - "game/oathbound/GUI/CodexMenu.gd"
      - "game/oathbound/GUI/OathboundReleaseCodexMenu.gd"
      - "game/oathbound/GUI/CodexMenu.tscn"
      - "game/oathbound/GUI/MerchantMenu.gd"
      - "game/oathbound/GUI/OathboundReleaseMerchantMenu.gd"
      - "game/oathbound/GUI/MerchantMenu.tscn"
      - "game/oathbound/GUI/BloodwellMenu.gd"
      - "game/oathbound/GUI/OathboundReleaseBloodwellMenu.gd"
      - "game/oathbound/GUI/BloodwellMenu.tscn"
      - "game/oathbound/GUI/BloodMirrorMenu.gd"
      - "game/oathbound/GUI/OathboundReleaseBloodMirrorMenu.gd"
      - "game/oathbound/GUI/BloodMirrorMenu.tscn"
      - "game/oathbound/GUI/HubHUD.gd"
      - "game/oathbound/GUI/RunHUD.gd"
      - "game/oathbound/Regions/Hushiro/Enemies/Standard/CorruptedSwordsman*.gd"
      - "game/oathbound/Regions/Hushiro/Enemies/Standard/CorruptedSwordsman.tscn"
      - "game/oathbound/TitleScreen/**"
      - "game/oathbound/Utility/MetaProgress.gd"
      - "game/oathbound/Utility/MetaProgressionManager.gd"
      - "game/oathbound/Utility/MerchantManager.gd"
      - "game/oathbound/Utility/OathboundRunScene.gd"
      - "game/oathbound/Utility/UpgradeChoiceUI.gd"
      - "game/oathbound/World/BloodCavern*"
      - "game/oathbound/World/BloodMirror.gd"
      - "game/oathbound/World/Boat.gd"
      - "game/oathbound/World/Hub.gd"
      - "game/oathbound/World/HubScene.tscn"
      - "game/oathbound/project.godot"
      - ".github/workflows/release-shell-check.yml"
  pull_request:
    paths:
      - "game/oathbound/Core/Release/**"
      - "game/oathbound/Core/Presentation/OathboundAchievementRuntime.gd"
      - "game/oathbound/Core/Progression/OathboundPersistentProstheticManager.gd"
      - "game/oathbound/Core/Progression/OathboundStrandProgressionManager.gd"
      - "game/oathbound/Core/Prosthetics/OathboundRunHUD.gd"
      - "game/oathbound/Core/Relics/OathboundUpgradeService.gd"
      - "game/oathbound/GUI/DiscoveryBoardMenu.gd"
      - "game/oathbound/GUI/OathboundAccessibleDiscoveryBoardMenu.gd"
      - "game/oathbound/GUI/OathboundDialogueOverlay.gd"
      - "game/oathbound/GUI/OathboundAccessibleDialogueOverlay.gd"
      - "game/oathbound/GUI/ForgeMenu.gd"
      - "game/oathbound/GUI/OathboundReleaseForgeMenu.gd"
      - "game/oathbound/GUI/ForgeMenu.tscn"
      - "game/oathbound/GUI/CodexMenu.gd"
      - "game/oathbound/GUI/OathboundReleaseCodexMenu.gd"
      - "game/oathbound/GUI/CodexMenu.tscn"
      - "game/oathbound/GUI/MerchantMenu.gd"
      - "game/oathbound/GUI/OathboundReleaseMerchantMenu.gd"
      - "game/oathbound/GUI/MerchantMenu.tscn"
      - "game/oathbound/GUI/BloodwellMenu.gd"
      - "game/oathbound/GUI/OathboundReleaseBloodwellMenu.gd"
      - "game/oathbound/GUI/BloodwellMenu.tscn"
      - "game/oathbound/GUI/BloodMirrorMenu.gd"
      - "game/oathbound/GUI/OathboundReleaseBloodMirrorMenu.gd"
      - "game/oathbound/GUI/BloodMirrorMenu.tscn"
      - "game/oathbound/GUI/HubHUD.gd"
      - "game/oathbound/GUI/RunHUD.gd"
      - "game/oathbound/Regions/Hushiro/Enemies/Standard/CorruptedSwordsman*.gd"
      - "game/oathbound/Regions/Hushiro/Enemies/Standard/CorruptedSwordsman.tscn"
      - "game/oathbound/TitleScreen/**"
      - "game/oathbound/Utility/MetaProgress.gd"
      - "game/oathbound/Utility/MetaProgressionManager.gd"
      - "game/oathbound/Utility/MerchantManager.gd"
      - "game/oathbound/Utility/OathboundRunScene.gd"
      - "game/oathbound/Utility/UpgradeChoiceUI.gd"
      - "game/oathbound/World/BloodCavern*"
      - "game/oathbound/World/BloodMirror.gd"
      - "game/oathbound/World/Boat.gd"
      - "game/oathbound/World/Hub.gd"
      - "game/oathbound/World/HubScene.tscn"
      - "game/oathbound/project.godot"
      - ".github/workflows/release-shell-check.yml"
  workflow_dispatch:

jobs:
  release-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project headlessly
        run: godot --headless --path game/oathbound --import

      - name: Verify release shell contract
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Release/Validation/ReleaseShellContractSmoke.tscn 2>&1 | tee release-shell-contract.log
          grep -F "[ReleaseShellContractSmoke] PASS - 3 slots | settings/rebinding | safe checkpoint | records/completion | Oathbound front end" release-shell-contract.log
          if grep -F "SCRIPT ERROR:" release-shell-contract.log; then
            echo "FAIL: release-shell contract emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" release-shell-contract.log; then
            echo "FAIL: release-shell contract emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify run-results presentation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Release/Validation/RunResultsOverlaySmoke.tscn 2>&1 | tee run-results-overlay.log
          grep -F "[RunResultsOverlaySmoke] PASS - failed run summary | retained progress | final build | Strand return" run-results-overlay.log
          if grep -F "SCRIPT ERROR:" run-results-overlay.log; then
            echo "FAIL: run-results presentation emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" run-results-overlay.log; then
            echo "FAIL: run-results presentation emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify dialogue accessibility behavior
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Release/Validation/DialogueAccessibilitySmoke.tscn 2>&1 | tee dialogue-accessibility.log
          grep -F "[DialogueAccessibilitySmoke] PASS - progressive reveal | confirm-to-reveal | Instant Text | speed scaling" dialogue-accessibility.log
          if grep -F "SCRIPT ERROR:" dialogue-accessibility.log; then
            echo "FAIL: dialogue accessibility smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" dialogue-accessibility.log; then
            echo "FAIL: dialogue accessibility smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify high contrast and Strand wallet
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Release/Validation/ReadabilityAndStrandHUDSmoke.tscn 2>&1 | tee readability-strand-hud.log
          grep -F "[ReadabilityAndStrandHUDSmoke] PASS - high contrast active | front end styled | Strand wallet Mist+Scrolls only" readability-strand-hud.log
          if grep -F "SCRIPT ERROR:" readability-strand-hud.log; then
            echo "FAIL: readability / Strand HUD smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" readability-strand-hud.log; then
            echo "FAIL: readability / Strand HUD smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify localization-ready release surfaces
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Release/Validation/LocalizationReadinessSmoke.tscn 2>&1 | tee localization-readiness.log
          grep -F "[LocalizationReadinessSmoke] PASS - dialogue | Technique rewards | Boat departure | Discovery Board | English fallback" localization-readiness.log
          if grep -F "SCRIPT ERROR:" localization-readiness.log; then
            echo "FAIL: localization readiness smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" localization-readiness.log; then
            echo "FAIL: localization readiness smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify canonical Run HUD rewards
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Release/Validation/RunHUDRewardSurfaceSmoke.tscn 2>&1 | tee run-hud-rewards.log
          grep -F "[RunHUDRewardSurfaceSmoke] PASS - canonical reward toast | deprecated generic Boss Emblem suppressed" run-hud-rewards.log
          if grep -F "SCRIPT ERROR:" run-hud-rewards.log; then
            echo "FAIL: Run HUD reward surface emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" run-hud-rewards.log; then
            echo "FAIL: Run HUD reward surface emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Blood Cavern training boundary
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Release/Validation/BloodCavernSurfaceSmoke.tscn 2>&1 | tee blood-cavern-surface.log
          grep -F "[BloodCavernSurfaceSmoke] PASS - live Blood Cavern | passive production-combat target | no enemy rewards | nested Blood Mirror | localized surface | tutorial refreshers | discovered Technique demos | real Execution Trial | training-state isolation" blood-cavern-surface.log
          if grep -F "SCRIPT ERROR:" blood-cavern-surface.log; then
            echo "FAIL: Blood Cavern surface emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" blood-cavern-surface.log; then
            echo "FAIL: Blood Cavern surface emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Codex release presentation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Release/Validation/CodexReleasePresentationSmoke.tscn 2>&1 | tee codex-release.log
          grep -F "[CodexReleasePresentationSmoke] PASS - localized Codex tabs | stable release wrapper | High Contrast" codex-release.log
          if grep -F "SCRIPT ERROR:" codex-release.log; then
            echo "FAIL: Codex release presentation emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" codex-release.log; then
            echo "FAIL: Codex release presentation emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Merchant release presentation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Release/Validation/MerchantReleasePresentationSmoke.tscn 2>&1 | tee merchant-release.log
          grep -F "[MerchantReleasePresentationSmoke] PASS - localized Merchant shell | stable catalog IDs | High Contrast" merchant-release.log
          if grep -F "SCRIPT ERROR:" merchant-release.log; then
            echo "FAIL: Merchant release presentation emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" merchant-release.log; then
            echo "FAIL: Merchant release presentation emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Strand progression release presentation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Release/Validation/StrandProgressionPresentationSmoke.tscn 2>&1 | tee strand-progression-release.log
          grep -F "[StrandProgressionPresentationSmoke] PASS - Bloodwell localization | Blood Mirror localization | stable progression IDs | High Contrast" strand-progression-release.log
          if grep -F "SCRIPT ERROR:" strand-progression-release.log; then
            echo "FAIL: Strand progression release presentation emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" strand-progression-release.log; then
            echo "FAIL: Strand progression release presentation emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Strand prompt glyph switching
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Release/Validation/HubPromptGlyphSmoke.tscn 2>&1 | tee hub-prompt-glyph.log
          grep -F "[HubPromptGlyphSmoke] PASS - keyboard [E] | controller [A] | live rebind [Y] | text-labelled prompts" hub-prompt-glyph.log
          grep -F "[HubPromptGlyphSmoke] Blood Cavern authority PASS - canonical station | no live PracticeGrounds node" hub-prompt-glyph.log
          if grep -F "SCRIPT ERROR:" hub-prompt-glyph.log; then
            echo "FAIL: Strand prompt glyph smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" hub-prompt-glyph.log; then
            echo "FAIL: Strand prompt glyph smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Upload release shell logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-shell-${{ github.run_id }}
          path: |
            release-shell-contract.log
            run-results-overlay.log
            dialogue-accessibility.log
            readability-strand-hud.log
            localization-readiness.log
            run-hud-rewards.log
            blood-cavern-surface.log
            codex-release.log
            merchant-release.log
            strand-progression-release.log
            hub-prompt-glyph.log
          if-no-files-found: warn
          retention-days: 7
