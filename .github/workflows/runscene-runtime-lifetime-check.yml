name: RunScene Runtime Lifetime Check

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "game/oathbound/**"
      - ".github/workflows/runscene-runtime-lifetime-check.yml"
  pull_request:
    paths:
      - "game/oathbound/**"
      - ".github/workflows/runscene-runtime-lifetime-check.yml"
  workflow_dispatch:

jobs:
  runscene-runtime-lifetime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path game/oathbound --import

      - name: Build temporary Area 2 / 3 RunScene fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("game/oathbound/Utility/RunScene.tscn").read_text()
          marker = 'script = ExtResource("1_v5377")\n'
          if source.count(marker) != 1:
              raise SystemExit("RunScene fixture marker drifted; refusing to create debug-area lifetime fixtures")

          for area in (2, 3):
              fixture = source.replace(marker, marker + f"debug_start_area = {area}\n", 1)
              Path(f"game/oathbound/Utility/.ci_RunSceneArea{area}.tscn").write_text(fixture)
          PY

      - name: Exercise current RunScene in all authored regions
        shell: bash
        run: |
          set -o pipefail
          for area in 1 2 3; do
            scene="res://Utility/RunScene.tscn"
            if [ "$area" != "1" ]; then
              scene="res://Utility/.ci_RunSceneArea${area}.tscn"
            fi
            log="runscene-area${area}-runtime-lifetime.log"
            echo "=== RunScene lifetime: Area ${area} ==="
            godot --headless --verbose --path game/oathbound --quit-after 30 "$scene" 2>&1 | tee "$log"
            grep -F "player_factory_assigned script=res://Player/OathboundCombatPlayer.gd" "$log"
            grep -F "[RunScene] starting run… area=${area}" "$log"
            if grep -F "SCRIPT ERROR:" "$log"; then
              echo "FAIL: Area ${area} RunScene emitted a GDScript runtime error."
              exit 1
            fi
            if grep -F "ERROR: Error calling deferred method:" "$log"; then
              echo "FAIL: Area ${area} RunScene emitted a deferred-call runtime error."
              exit 1
            fi
          done

      - name: Upload verbose RunScene lifetime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runscene-runtime-lifetime-${{ github.run_id }}
          path: runscene-area*-runtime-lifetime.log
          if-no-files-found: warn
          retention-days: 7

      - name: Assert clean RunScene teardown in all authored regions
        shell: bash
        run: |
          failed=0
          for log in runscene-area*-runtime-lifetime.log; do
            if grep -F "ObjectDB instance was leaked at exit" "$log"; then
              echo "FAIL: $log leaked an ObjectDB instance at shutdown."
              failed=1
            fi
            if grep -F "ERROR: Cannot get path of node as it is not in a scene tree." "$log"; then
              echo "FAIL: $log queried the path of a detached node during teardown."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "PASS: RunScene exits with clean runtime ownership in Areas 1, 2, and 3"
