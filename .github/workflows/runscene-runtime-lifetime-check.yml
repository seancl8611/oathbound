name: RunScene Runtime Lifetime Check

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "game/oathbound/**"
      - ".github/workflows/runscene-runtime-lifetime-check.yml"
  pull_request:
    paths:
      - "game/oathbound/**"
      - ".github/workflows/runscene-runtime-lifetime-check.yml"
  workflow_dispatch:

jobs:
  runscene-runtime-lifetime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path game/oathbound --import

      - name: Inventory dynamic Timer ownership
        shell: bash
        run: |
          {
            echo "=== Timer.new() ==="
            grep -RIn --include='*.gd' -F 'Timer.new()' game/oathbound || true
            echo "=== remove_child() ==="
            grep -RIn --include='*.gd' -F 'remove_child(' game/oathbound || true
          } | tee runscene-timer-inventory.log

      - name: Inject runtime Timer instance probes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          probes = {
              "game/oathbound/Core/Chambers/CombatChamberBase.gd": [
                  ("\t\tvar t = Timer.new()\n", "\t\tvar t = Timer.new()\n\t\tprint(\"[TimerProbe] CombatChamberBase.TokenTick id=%s\" % t.get_instance_id())\n"),
              ],
              "game/oathbound/Utility/CombatController.gd": [
                  ("\t_parry_series_timer = Timer.new()\n", "\t_parry_series_timer = Timer.new()\n\tprint(\"[TimerProbe] CombatController.ParrySeries id=%s host=%s\" % [_parry_series_timer.get_instance_id(), get_parent().name if get_parent() else \"none\"])\n"),
              ],
              "game/oathbound/Utility/AttackDirector.gd": [
                  ("\tvar crowd_timer := Timer.new()\n", "\tvar crowd_timer := Timer.new()\n\tprint(\"[TimerProbe] AttackDirector.CrowdTick id=%s\" % crowd_timer.get_instance_id())\n"),
                  ("\tvar stall_timer := Timer.new()\n", "\tvar stall_timer := Timer.new()\n\tprint(\"[TimerProbe] AttackDirector.StallPrevention id=%s\" % stall_timer.get_instance_id())\n"),
              ],
              "game/oathbound/Regions/Hushiro/Enemies/Legacy/CorruptedSwordsmanLegacy.gd": [
                  ("\t_humanoid_base_ready()\n", "\t_humanoid_base_ready()\n\tprint(\"[TimerProbe] CorruptedSwordsmanLegacy.attack_timer id=%s parent=%s\" % [attack_timer.get_instance_id(), attack_timer.get_parent().name if attack_timer.get_parent() else \"none\"])\n"),
              ],
          }

          for raw_path, replacements in probes.items():
              path = Path(raw_path)
              text = path.read_text()
              for needle, replacement in replacements:
                  if needle not in text:
                      raise SystemExit(f"probe target not found: {raw_path}: {needle!r}")
                  text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY

      - name: Exercise current RunScene with verbose lifetime diagnostics
        shell: bash
        run: |
          set -o pipefail
          godot --headless --verbose --path game/oathbound --quit-after 30 res://Utility/RunScene.tscn 2>&1 | tee runscene-runtime-lifetime.log
          grep -F "player_factory_assigned script=res://Player/OathboundCombatPlayer.gd" runscene-runtime-lifetime.log
          if grep -F "SCRIPT ERROR:" runscene-runtime-lifetime.log; then
            echo "FAIL: RunScene emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" runscene-runtime-lifetime.log; then
            echo "FAIL: RunScene emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Upload RunScene lifetime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runscene-runtime-lifetime-${{ github.run_id }}
          path: |
            runscene-runtime-lifetime.log
            runscene-timer-inventory.log
          if-no-files-found: warn
          retention-days: 7

      - name: Assert clean ObjectDB shutdown
        shell: bash
        run: |
          if grep -F "ObjectDB instance was leaked at exit" runscene-runtime-lifetime.log; then
            echo "FAIL: RunScene leaked an ObjectDB instance at shutdown. See the uploaded verbose lifetime log for the leaked class/instance."
            exit 1
          fi
          echo "PASS: RunScene exits without ObjectDB instance leaks"
