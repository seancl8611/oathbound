name: Keeper Transition Readability Check

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "game/oathbound/Regions/Hushiro/Enemies/Bosses/Keeper.gd"
      - "game/oathbound/Regions/Hushiro/Enemies/Bosses/KeeperReadability.gd"
      - "game/oathbound/Regions/Hushiro/Enemies/Bosses/Keeper.tscn"
      - "game/oathbound/Player/OathboundPlayerStability.gd"
      - "game/oathbound/autoload/OathboundRegionGameFlow.gd"
      - "game/oathbound/Core/Release/Validation/KeeperTransitionReadabilitySmoke.gd"
      - "game/oathbound/Core/Release/Validation/KeeperTransitionReadabilitySmoke.tscn"
      - ".github/workflows/keeper-transition-readability-check.yml"
  pull_request:
    paths:
      - "game/oathbound/Regions/Hushiro/Enemies/Bosses/Keeper.gd"
      - "game/oathbound/Regions/Hushiro/Enemies/Bosses/KeeperReadability.gd"
      - "game/oathbound/Regions/Hushiro/Enemies/Bosses/Keeper.tscn"
      - "game/oathbound/Player/OathboundPlayerStability.gd"
      - "game/oathbound/autoload/OathboundRegionGameFlow.gd"
      - "game/oathbound/Core/Release/Validation/KeeperTransitionReadabilitySmoke.gd"
      - "game/oathbound/Core/Release/Validation/KeeperTransitionReadabilitySmoke.tscn"
      - ".github/workflows/keeper-transition-readability-check.yml"
  workflow_dispatch:

jobs:
  keeper-transition-readability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project headlessly
        run: godot --headless --path game/oathbound --import

      - name: Verify Keeper and Region 2 transition contracts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Release/Validation/KeeperTransitionReadabilitySmoke.tscn 2>&1 | tee keeper-transition-readability.log
          grep -F "[KeeperTransitionReadabilitySmoke] PASS - Keeper readable timing | annular shockwave | telegraph-matched sweep | attack-area defense flags | Area 2 transition clears before choice" keeper-transition-readability.log
          if grep -F "SCRIPT ERROR:" keeper-transition-readability.log; then
            echo "FAIL: Keeper transition regression emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" keeper-transition-readability.log; then
            echo "FAIL: Keeper transition regression emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keeper-transition-readability-${{ github.run_id }}
          path: keeper-transition-readability.log
          if-no-files-found: warn
          retention-days: 7
