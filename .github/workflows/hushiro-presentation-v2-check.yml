name: Hushiro Presentation V2 Check

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

jobs:
  hushiro-presentation-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: godot --headless --path game/oathbound --import

      - name: Verify second-pass Hushiro presentation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Regions/Hushiro/Validation/Planar3DPresentationV2Smoke.tscn 2>&1 | tee hushiro-presentation-v2.log
          grep -F "[Planar3DPresentationV2Smoke] PASS" hushiro-presentation-v2.log
          if grep -F "SCRIPT ERROR:" hushiro-presentation-v2.log; then
            echo "FAIL: Hushiro V2 presentation emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" hushiro-presentation-v2.log; then
            echo "FAIL: Hushiro V2 presentation emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify freed-source presentation lifetime
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Regions/Hushiro/Validation/Planar3DFreedSourceLifetimeSmoke.tscn 2>&1 | tee planar3d-freed-source-lifetime.log
          grep -F "[Planar3DFreedSourceLifetimeSmoke] PASS" planar3d-freed-source-lifetime.log
          if grep -F "SCRIPT ERROR:" planar3d-freed-source-lifetime.log; then
            echo "FAIL: freed-source presentation lifetime smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" planar3d-freed-source-lifetime.log; then
            echo "FAIL: freed-source presentation lifetime smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Hushiro enemy separation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Regions/Hushiro/Validation/HushiroEnemySeparationSmoke.tscn 2>&1 | tee hushiro-enemy-separation.log
          grep -F "[HushiroEnemySeparationSmoke] PASS" hushiro-enemy-separation.log
          if grep -F "SCRIPT ERROR:" hushiro-enemy-separation.log; then
            echo "FAIL: Hushiro enemy separation emitted a GDScript runtime error."
            exit 1
          fi

      - name: Verify production model validator contract
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Regions/Hushiro/Validation/Planar3DProductionModelValidatorSmoke.tscn 2>&1 | tee hushiro-production-model-validator.log
          grep -F "[Planar3DProductionModelValidatorSmoke] PASS" hushiro-production-model-validator.log
          if grep -F "SCRIPT ERROR:" hushiro-production-model-validator.log; then
            echo "FAIL: production model validator smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" hushiro-production-model-validator.log; then
            echo "FAIL: production model validator smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify source-driven production GLB animation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Regions/Hushiro/Validation/Planar3DExternalAnimationSyncSmoke.tscn 2>&1 | tee hushiro-production-animation-sync.log
          grep -F "[Planar3DExternalAnimationSyncSmoke] PASS" hushiro-production-animation-sync.log
          if grep -F "SCRIPT ERROR:" hushiro-production-animation-sync.log; then
            echo "FAIL: source-driven production animation smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" hushiro-production-animation-sync.log; then
            echo "FAIL: source-driven production animation smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify production GLB state diagnostics
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Regions/Hushiro/Validation/Planar3DProductionModelStateSmoke.tscn 2>&1 | tee hushiro-production-model-state.log
          grep -F "[Planar3DProductionModelStateSmoke] PASS" hushiro-production-model-state.log
          if grep -F "SCRIPT ERROR:" hushiro-production-model-state.log; then
            echo "FAIL: Hushiro production model state smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" hushiro-production-model-state.log; then
            echo "FAIL: Hushiro production model state smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Smoke live Hushiro combat chamber wiring
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound --quit-after 30 res://Utility/RunScene.tscn 2>&1 | tee hushiro-v2-runscene.log
          # Presence of the V3 marker proves the production RunScene used the hybrid
          # presentation. Exact framing values are manual-playtest tuning and should not
          # make CI brittle when zoom/actor scale are deliberately adjusted.
          grep -F "[HushiroPlanar3DV3] revision=3 hybrid_2_5d=true" hushiro-v2-runscene.log
          grep -F "[Planar3DPresentationBridge] Live real-time 3D presentation active" hushiro-v2-runscene.log
          if grep -F "SCRIPT ERROR:" hushiro-v2-runscene.log; then
            echo "FAIL: live Hushiro V3 RunScene emitted a GDScript runtime error."
            exit 1
          fi

      - name: Upload V2 presentation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hushiro-presentation-v2-${{ github.run_id }}
          path: |
            hushiro-presentation-v2.log
            planar3d-freed-source-lifetime.log
            hushiro-enemy-separation.log
            hushiro-production-model-validator.log
            hushiro-production-animation-sync.log
            hushiro-production-model-state.log
            hushiro-v2-runscene.log
          if-no-files-found: warn
          retention-days: 7
