name: Hushiro Combat Semantics Check

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

jobs:
  hushiro-combat-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import and compile project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound --import 2>&1 | tee hushiro-combat-import.log
          godot --headless --editor --path game/oathbound --quit-after 3 2>&1 | tee hushiro-combat-editor.log
          if grep -F "SCRIPT ERROR:" hushiro-combat-import.log hushiro-combat-editor.log; then
            echo "FAIL: Hushiro combat import/compile emitted a GDScript error."
            exit 1
          fi

      - name: Verify Hushiro combat semantics
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Regions/Hushiro/Validation/HushiroCombatSemanticsSmoke.tscn 2>&1 | tee hushiro-combat-semantics.log
          grep -F "[HushiroCombatSemanticsSmoke] PASS - shared Hound posture stagger-first deathblow pack cap" hushiro-combat-semantics.log
          if grep -F "SCRIPT ERROR:" hushiro-combat-semantics.log; then
            echo "FAIL: Hushiro combat semantics emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" hushiro-combat-semantics.log; then
            echo "FAIL: Hushiro combat semantics emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Hushiro defense contract
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Regions/Hushiro/Validation/HushiroDefenseContractSmoke.tscn 2>&1 | tee hushiro-defense-contract.log
          grep -F "[HushiroDefenseContractSmoke] PASS - player block HP-exclusive | V2 enemy guard partial HP + Posture | real HP number exact | perilous thrust bypass + warning" hushiro-defense-contract.log
          if grep -F "SCRIPT ERROR:" hushiro-defense-contract.log; then
            echo "FAIL: Hushiro defense contract emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" hushiro-defense-contract.log; then
            echo "FAIL: Hushiro defense contract emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify live guard readability path
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Regions/Hushiro/Validation/HushiroGuardReadabilitySmoke.tscn 2>&1 | tee hushiro-guard-readability.log
          grep -F "[HushiroGuardReadabilitySmoke] PASS - visible guard | canonical partial 4 HP + 14 Posture | exact HP number" hushiro-guard-readability.log
          if grep -F "SCRIPT ERROR:" hushiro-guard-readability.log; then
            echo "FAIL: Guard readability smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" hushiro-guard-readability.log; then
            echo "FAIL: Guard readability smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Combat V2 response foundation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Combat/Validation/EnemyCombatResponseSmoke.tscn 2>&1 | tee enemy-combat-response.log
          grep -F "[EnemyCombatResponseSmoke] PASS - authored guard window | partial guard Health | state poise" enemy-combat-response.log
          if grep -F "SCRIPT ERROR:" enemy-combat-response.log; then
            echo "FAIL: Combat V2 response smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" enemy-combat-response.log; then
            echo "FAIL: Combat V2 response smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Combat V2 action and motor foundation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Combat/Validation/CombatActionMotorSmoke.tscn 2>&1 | tee combat-action-motor.log
          grep -F "[CombatActionMotorSmoke] PASS - startup momentum | commit lock | authored action motion | Swordsman integration" combat-action-motor.log
          if grep -F "SCRIPT ERROR:" combat-action-motor.log; then
            echo "FAIL: Combat V2 action/motor smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" combat-action-motor.log; then
            echo "FAIL: Combat V2 action/motor smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Combat V2 Player action and motor foundation
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Combat/Validation/PlayerActionMotorSmoke.tscn 2>&1 | tee player-action-motor.log
          grep -F "[PlayerActionMotorSmoke] PASS - attack locomotion | commit steering | action composition | dash preservation | canonical Player integration" player-action-motor.log
          if grep -F "SCRIPT ERROR:" player-action-motor.log; then
            echo "FAIL: Combat V2 Player action/motor smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" player-action-motor.log; then
            echo "FAIL: Combat V2 Player action/motor smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Combat V2 EnemyBrain cadence
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Combat/Validation/EnemyBrainSmoke.tscn 2>&1 | tee enemy-brain.log
          grep -F "[EnemyBrainSmoke] PASS - controlled cadence | held intent | Swordsman tactical ownership" enemy-brain.log
          if grep -F "SCRIPT ERROR:" enemy-brain.log; then
            echo "FAIL: Combat V2 EnemyBrain smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" enemy-brain.log; then
            echo "FAIL: Combat V2 EnemyBrain smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Combat V2 pressure-window scheduler
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Combat/Validation/PressureDirectorSmoke.tscn 2>&1 | tee pressure-director.log
          grep -F "[PressureDirectorSmoke] PASS - overlapping windups | spaced impacts | perilous safety | legacy compatibility | Swordsman integration" pressure-director.log
          if grep -F "SCRIPT ERROR:" pressure-director.log; then
            echo "FAIL: Combat V2 pressure director smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" pressure-director.log; then
            echo "FAIL: Combat V2 pressure director smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Combat V2 Hound migration
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Combat/Validation/HoundV2MigrationSmoke.tscn 2>&1 | tee hound-v2-migration.log
          grep -F "[HoundV2MigrationSmoke] PASS - predator brain | action commitment | motor ownership | Poise | pressure windows | Posture preservation" hound-v2-migration.log
          if grep -F "SCRIPT ERROR:" hound-v2-migration.log; then
            echo "FAIL: Combat V2 Hound migration smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" hound-v2-migration.log; then
            echo "FAIL: Combat V2 Hound migration smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Combat V2 Hollow migration
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Combat/Validation/HollowV2MigrationSmoke.tscn 2>&1 | tee hollow-v2-migration.log
          grep -F "[HollowV2MigrationSmoke] PASS - simple fodder brain | pressure bite | commitment | low poise | Posture preserved" hollow-v2-migration.log
          if grep -F "SCRIPT ERROR:" hollow-v2-migration.log; then
            echo "FAIL: Combat V2 Hollow migration smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" hollow-v2-migration.log; then
            echo "FAIL: Combat V2 Hollow migration smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Combat V2 Archer migration
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Combat/Validation/ArcherV2MigrationSmoke.tscn 2>&1 | tee archer-v2-migration.log
          grep -F "[ArcherV2MigrationSmoke] PASS - ranged brain | arrival pressure | aim commitment | low poise | Posture preserved" archer-v2-migration.log
          if grep -F "SCRIPT ERROR:" archer-v2-migration.log; then
            echo "FAIL: Combat V2 Archer migration smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" archer-v2-migration.log; then
            echo "FAIL: Combat V2 Archer migration smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Combat V2 Bilemass migration
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Combat/Validation/BilemassV2MigrationSmoke.tscn 2>&1 | tee bilemass-v2-migration.log
          grep -F "[BilemassV2MigrationSmoke] PASS - hazard brain | landing pressure | spit commitment | Poise | puddle contract | Posture preserved" bilemass-v2-migration.log
          if grep -F "SCRIPT ERROR:" bilemass-v2-migration.log; then
            echo "FAIL: Combat V2 Bilemass migration smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" bilemass-v2-migration.log; then
            echo "FAIL: Combat V2 Bilemass migration smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Verify Combat V2 Warden migration
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path game/oathbound res://Core/Combat/Validation/WardenV2MigrationSmoke.tscn 2>&1 | tee warden-v2-migration.log
          grep -F "[WardenV2MigrationSmoke] PASS - control brain | perilous restraint pressure | explicit commitment | stateful Poise | short guard | restraint/Posture preserved" warden-v2-migration.log
          if grep -F "SCRIPT ERROR:" warden-v2-migration.log; then
            echo "FAIL: Combat V2 Warden migration smoke emitted a GDScript runtime error."
            exit 1
          fi
          if grep -F "ERROR: Error calling deferred method:" warden-v2-migration.log; then
            echo "FAIL: Combat V2 Warden migration smoke emitted a deferred-call runtime error."
            exit 1
          fi

      - name: Upload Hushiro combat validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hushiro-combat-validation-${{ github.run_id }}
          path: |
            hushiro-combat-import.log
            hushiro-combat-editor.log
            hushiro-combat-semantics.log
            hushiro-defense-contract.log
            hushiro-guard-readability.log
            enemy-combat-response.log
            combat-action-motor.log
            player-action-motor.log
            enemy-brain.log
            pressure-director.log
            hound-v2-migration.log
            hollow-v2-migration.log
            archer-v2-migration.log
            bilemass-v2-migration.log
            warden-v2-migration.log
          if-no-files-found: warn
          retention-days: 7
